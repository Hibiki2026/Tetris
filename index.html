
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAINBOW TETRIS</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 background:radial-gradient(circle at top,#29245e,#090b1d 70%);
 color:white;font-family:system-ui,sans-serif;
 display:flex;justify-content:center;align-items:center;
 overflow-x:hidden;
}
#app{width:min(95vw,560px);text-align:center;padding:15px}
h1{
 font-size:clamp(30px,7vw,48px);margin:4px;
 background:linear-gradient(90deg,#ff4d9d,#ffd43b,#39e9d0,#8d70ff);
 color:transparent;background-clip:text;
 text-shadow:0 0 25px #a45cff55;
}
.sub{color:#aeb5e8;margin-bottom:15px}
.stats{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.stat{
 flex:1;background:#ffffff12;border:1px solid #ffffff25;
 border-radius:12px;padding:9px;
}
.stat small{display:block;color:#aab0d6}
.stat b{font-size:22px;color:#fff}
.game-layout{display:flex;gap:12px;justify-content:center;align-items:flex-start}
canvas{
 display:block;width:min(68vw,300px);height:auto;
 border:2px solid #a78bfa;border-radius:10px;
 background:#0b1027;
 box-shadow:0 0 25px #8b5cf655;
}
.side{width:110px}
.panel{
 background:#ffffff12;border:1px solid #ffffff25;
 border-radius:12px;padding:10px;margin-bottom:12px;
}
.panel small{color:#adb5e8}
#next{width:90px;height:90px;margin-top:5px}
button{
 border:0;border-radius:12px;padding:11px 14px;
 background:linear-gradient(135deg,#8b5cf6,#ec4899);
 color:white;font-weight:bold;cursor:pointer;
 box-shadow:0 4px 15px #0005;
}
button:active{transform:scale(.94)}
.buttons{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.mobile{display:flex;gap:10px;justify-content:center;margin-top:10px}
.mobile button{min-width:55px;font-size:21px}
#message{height:25px;color:#ffd86b;font-weight:bold}
#screen{
 position:relative;display:inline-block;
}
#overlay{
 display:none;position:absolute;inset:0;
 background:#080b1ddd;border-radius:10px;
 align-items:center;justify-content:center;flex-direction:column;
 gap:12px;
}
#overlay.show{display:flex}
@keyframes shake{
 0%,100%{transform:translate(0,0)}
 15%{transform:translate(-7px,3px)}
 30%{transform:translate(7px,-3px)}
 45%{transform:translate(-5px,-3px)}
 60%{transform:translate(5px,3px)}
 75%{transform:translate(-3px,0)}
}
@keyframes flash{
 0%{filter:brightness(1)}
 40%{filter:brightness(2.5)}
 100%{filter:brightness(1)}
}
.shake{animation:shake .28s ease}
.bigshake{animation:shake .48s ease}
.flash{animation:flash .3s ease}
@media(max-width:420px){
 .side{width:88px}
 .game-layout{gap:7px}
 .panel{padding:7px}
 #next{width:75px;height:75px}
}
</style>
</head>
<body>
<div id="app">
<h1>🌈 RAINBOW TETRIS</h1>
<div class="sub">COLOR YOUR WORLD!</div>

<div class="stats">
 <div class="stat"><small>SCORE</small><b id="score">0</b></div>
 <div class="stat"><small>LEVEL</small><b id="level">1</b></div>
 <div class="stat"><small>LINES</small><b id="lines">0</b></div>
</div>

<div class="game-layout">
 <div id="screen">
  <canvas id="board" width="300" height="600"></canvas>
  <div id="overlay">
   <h2 id="overTitle">GAME OVER</h2>
   <div id="finalScore"></div>
   <button onclick="restart()">もう一度遊ぶ</button>
  </div>
 </div>
 <div class="side">
  <div class="panel">
   <small>NEXT BLOCK</small>
   <canvas id="next" width="120" height="120"></canvas>
  </div>
  <div class="panel">
   <small>BEST SCORE</small>
   <b id="best">0</b>
  </div>
  <div class="panel">
   <small>CONTROLS</small>
   <p style="font-size:12px;line-height:1.8">
    ← → 移動<br>
    ↑ 回転<br>
    ↓ 落下<br>
    SPACE 一気に落下<br>
    P 一時停止
   </p>
  </div>
 </div>
</div>

<div id="message"></div>
<div class="buttons">
 <button onclick="restart()">🔄 RESTART</button>
 <button onclick="togglePause()">⏸ PAUSE</button>
</div>
<div class="mobile">
 <button onclick="move(-1)">◀</button>
 <button onclick="rotate()">↻</button>
 <button onclick="softDrop()">▼</button>
 <button onclick="move(1)">▶</button>
 <button onclick="hardDrop()">⬇</button>
</div>
</div>

<script>
const canvas=document.getElementById('board');
const ctx=canvas.getContext('2d');
const nc=document.getElementById('next');
const nx=nc.getContext('2d');

const COLS=10,ROWS=20,SIZE=30;

const shapes=[
 {color:'#ff4d9d',shape:[[1,1,1,1]]},
 {color:'#38d9ff',shape:[[1,0,0],[1,1,1]]},
 {color:'#ffb52e',shape:[[0,0,1],[1,1,1]]},
 {color:'#b66bff',shape:[[1,1],[1,1]]},
 {color:'#50e3a4',shape:[[0,1,1],[1,1,0]]},
 {color:'#ff5964',shape:[[0,1,0],[1,1,1]]},
 {color:'#f5e642',shape:[[1,1,0],[0,1,1]]}
];

let board,player,nextPiece,score,lines,level;
let running=false,paused=false,over=false;
let last=0,dropCounter=0,dropInterval=850;
let best=Number(localStorage.getItem('rainbowBest')||0);
document.getElementById('best').textContent=best;

function emptyBoard(){
 return Array.from({length:ROWS},()=>Array(COLS).fill(0));
}
function randomPiece(){
 const p=shapes[Math.floor(Math.random()*shapes.length)];
 return {
  shape:p.shape.map(r=>[...r]),
  color:p.color,
  x:3,y:0
 };
}
function collide(p){
 for(let y=0;y<p.shape.length;y++)
 for(let x=0;x<p.shape[y].length;x++){
  if(!p.shape[y][x])continue;
  let bx=p.x+x,by=p.y+y;
  if(bx<0||bx>=COLS||by>=ROWS)return true;
  if(by>=0&&board[by][bx])return true;
 }
 return false;
}
function merge(){
 player.shape.forEach((row,y)=>row.forEach((v,x)=>{
  if(v&&player.y+y>=0)
   board[player.y+y][player.x+x]=player.color;
 }));
}
function rotate(){
 if(!running||paused||over)return;
 const old=player.shape;
 const rotated=old[0].map((_,i)=>old.map(row=>row[i]).reverse());
 player.shape=rotated;
 if(collide(player))player.shape=old;
 draw();
}
function move(dir){
 if(!running||paused||over)return;
 player.x+=dir;
 if(collide(player))player.x-=dir;
 draw();
}
function softDrop(){
 if(!running||paused||over)return;
 player.y++;
 if(collide(player)){
  player.y--;
  lock();
 }else score+=1;
 updateStats();draw();
}
function hardDrop(){
 if(!running||paused||over)return;
 while(!collide(player))player.y++;
 player.y--;
 lock();
}
function lock(){
 merge();
 shake(false);
 clearLines();
 player=nextPiece;
 nextPiece=randomPiece();
 drawNext();
 if(collide(player)){
  endGame();
 }
 draw();
}
function clearLines(){
 let count=0;
 for(let y=ROWS-1;y>=0;y--){
  if(board[y].every(Boolean)){
   board.splice(y,1);
   board.unshift(Array(COLS).fill(0));
   count++;y++;
  }
 }
 if(count){
  const points=[0,100,300,500,800];
  score+=points[count]*level;
  lines+=count;
  level=Math.floor(lines/10)+1;
  dropInterval=Math.max(100,850-(level-1)*65);
  shake(true);
  document.getElementById('message').textContent=
   ['','NICE! ✨','DOUBLE! 💥','TRIPLE! 🌈','TETRIS!!! 🔥'][count];
  setTimeout(()=>document.getElementById('message').textContent='',1000);
 }
 updateStats();
}
function shake(strong){
 const screen=document.getElementById('screen');
 screen.classList.remove('shake','bigshake');
 void screen.offsetWidth;
 screen.classList.add(strong?'bigshake':'shake');
 canvas.classList.remove('flash');
 if(strong){
  void canvas.offsetWidth;
  canvas.classList.add('flash');
 }
}
function updateStats(){
 document.getElementById('score').textContent=score;
 document.getElementById('lines').textContent=lines;
 document.getElementById('level').textContent=level;
 if(score>best){
  best=score;
  localStorage.setItem('rainbowBest',best);
  document.getElementById('best').textContent=best;
 }
}
function drawCell(c,x,y,size=SIZE){
 c.fillStyle=x.color;
 c.shadowColor=x.color;
 c.shadowBlur=9;
 c.fillRect(y*size+2,0,0,0);
}
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#0b1027';
 ctx.fillRect(0,0,300,600);

 ctx.strokeStyle='#ffffff12';
 for(let x=0;x<=COLS;x++){
  ctx.beginPath();ctx.moveTo(x*SIZE,0);ctx.lineTo(x*SIZE,600);ctx.stroke();
 }
 for(let y=0;y<=ROWS;y++){
  ctx.beginPath();ctx.moveTo(0,y*SIZE);ctx.lineTo(300,y*SIZE);ctx.stroke();
 }

 board.forEach((row,y)=>row.forEach((color,x)=>{
  if(color)paint(ctx,x,y,color);
 }));

 if(player){
  player.shape.forEach((row,y)=>row.forEach((v,x)=>{
   if(v)paint(ctx,player.x+x,player.y+y,player.color);
  }));
 }
}
function paint(c,x,y,color){
 c.fillStyle=color;
 c.shadowColor=color;
 c.shadowBlur=10;
 c.fillRect(x*SIZE+2,y*SIZE+2,SIZE-4,SIZE-4);
 c.shadowBlur=0;
 c.fillStyle='#ffffff45';
 c.fillRect(x*SIZE+5,y*SIZE+5,SIZE-10,4);
}
function drawNext(){
 nx.clearRect(0,0,120,120);
 nx.fillStyle='#0b1027';nx.fillRect(0,0,120,120);
 const s=nextPiece.shape;
 const w=s[0].length*23,h=s.length*23;
 const ox=(120-w)/2,oy=(120-h)/2;
 s.forEach((row,y)=>row.forEach((v,x)=>{
  if(v)paintSmall(ox+x*23,oy+y*23,nextPiece.color);
 }));
}
function paintSmall(x,y,color){
 nx.fillStyle=color;
 nx.shadowColor=color;nx.shadowBlur=8;
 nx.fillRect(x+2,y+2,19,19);
 nx.shadowBlur=0;
 nx.fillStyle='#ffffff55';
 nx.fillRect(x+4,y+4,15,3);
}
function endGame(){
 over=true;running=false;
 document.getElementById('overlay').classList.add('show');
 document.getElementById('overTitle').textContent='GAME OVER 💥';
 document.getElementById('finalScore').textContent='SCORE: '+score;
 shake(true);
}
function togglePause(){
 if(over)return;
 if(!running)return;
 paused=!paused;
 document.getElementById('message').textContent=paused?'PAUSED ⏸':'';
}
function restart(){
 board=emptyBoard();
 score=0;lines=0;level=1;
 dropInterval=850;dropCounter=0;
 player=randomPiece();nextPiece=randomPiece();
 running=true;paused=false;over=false;
 document.getElementById('overlay').classList.remove('show');
 document.getElementById('message').textContent='';
 updateStats();drawNext();draw();
}
function update(time=0){
 const delta=time-last;last=time;
 if(running&&!paused&&!over){
  dropCounter+=delta;
  if(dropCounter>dropInterval){
   softStep();
   dropCounter=0;
  }
 }
 requestAnimationFrame(update);
}
function softStep(){
 player.y++;
 if(collide(player)){
  player.y--;
  lock();
 }
 draw();
}
document.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))
  e.preventDefault();
 if(e.key==='ArrowLeft')move(-1);
 if(e.key==='ArrowRight')move(1);
 if(e.key==='ArrowUp')rotate();
 if(e.key==='ArrowDown')softDrop();
 if(e.code==='Space')hardDrop();
 if(e.key.toLowerCase()==='p')togglePause();
 if(e.key.toLowerCase()==='r')restart();
});

restart();
requestAnimationFrame(update);
</script>
</body>
</html>
